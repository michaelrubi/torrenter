# Builds the container image and publishes it to Docker Hub on every push to
# main. Deploys are pulled, not pushed: Flux image automation in the homelab
# repo watches mrubi86/torrenter, picks the newest main-<sha>-<timestamp> tag,
# commits it to manifests/media/torrenter.yaml and rolls it out. GitHub's
# runners never need to reach the cluster.
#
# Tags pushed from main:
#   main-<sha7>-<commit unix time>  immutable, sortable; what Flux deploys
#   latest                          convenience for manual `docker run`
#
# The timestamp is the commit's, not the build's, so re-running an old
# workflow cannot produce a tag that sorts above newer commits.
#
# Required repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub
# access token with Read & Write scope).
name: docker-publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: mrubi86/torrenter

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the Dockerfile's base image.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          ts=$(git log -1 --format=%ct)
          echo "deploy=main-${GITHUB_SHA::7}-${ts}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # PRs and non-main dispatches build only, so a broken Dockerfile fails
      # the PR instead of the deploy.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.deploy }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
